name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A1FC2B: ${{ secrets.A1FC2B }}
          B34D00: ${{ secrets.B34D00 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A1FC2B', '')
          bm = os.environ.get('B34D00', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- e4efb304c6b8e519984560454c8379b3cf72 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 07e68fa4163e02d7b8c11bbbc69a3c5b11030c -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
